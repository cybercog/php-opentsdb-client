services:
  php80:
    container_name: php-opentsdb-client-lib-php-80
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.0"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - php-opentsdb-client-lib

  php81:
    container_name: php-opentsdb-client-lib-php-81
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.1"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - php-opentsdb-client-lib

  php82:
    container_name: php-opentsdb-client-lib-php-82
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.2"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - php-opentsdb-client-lib

  php83:
    container_name: php-opentsdb-client-lib-php-83
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.3"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - php-opentsdb-client-lib

  php84:
    container_name: php-opentsdb-client-lib-php-84
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.4"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - php-opentsdb-client-lib

  php85:
    container_name: php-opentsdb-client-lib-php-85
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.5"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - php-opentsdb-client-lib

  opentsdb:
    container_name: php-opentsdb-client-lib-opentsdb
    image: petergrace/opentsdb-docker:latest
    environment:
      - WAITSECS=30 # Give time for hbase to shut down, otherwise data corruption may result
    ports:
      - 4242:4242
    networks:
      - php-opentsdb-client-lib
    volumes:
      - "./.docker_data_hbase:/data/hbase"

networks:
  php-opentsdb-client-lib:
    driver: bridge
